name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Ruff check
        run: uv run ruff check src/ tests/
      - name: Ruff format
        run: uv run ruff format --check src/ tests/
      - name: Mypy
        run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Pytest with branch coverage
        run: uv run python -m pytest --cov=src --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Audit locked Python environment
        # Chroma runs embedded only; its vulnerable FastAPI server is never started or exposed.
        # Remove this scoped exception when upstream publishes a confirmed fix.
        run: >-
          uv run python -m pip_audit --skip-editable
          --ignore-vuln PYSEC-2026-311
      - name: Scan current tree for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          detect --source=/repo --no-git --redact --config=/repo/.gitleaks.toml

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate secure Compose defaults
        env:
          MOBOTIX_PASSWORD: placeholder
          MQTT_USERNAME: knx-agent
          MQTT_PASSWORD: placeholder
        run: |
          mkdir -p secrets
          touch secrets/mosquitto_password_file frigate.yml
          docker compose config --quiet
          docker compose config --format json > /tmp/compose.json
          python - <<'PY'
          import json

          with open("/tmp/compose.json", encoding="utf-8") as handle:
              compose = json.load(handle)

          for name, service in compose["services"].items():
              assert service.get("privileged") is not True, f"{name} is privileged"
              for port in service.get("ports", []):
                  assert port.get("host_ip") == "127.0.0.1", (
                      f"{name} publishes {port.get('published')} beyond loopback"
                  )
          PY
