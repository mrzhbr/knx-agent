[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knx-agent"
version = "0.1.0"
description = "Local-first AI agent for KNX installations via Gira X1"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "strands-agents>=0.1",
    "strands-agents-tools>=0.1",
    "openai>=1.0",
    "matrix-nio>=0.24",
    "chromadb>=0.5",
    "networkx>=3.3",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "astral>=3.2",
    "aiomqtt>=2.3",
    "ollama>=0.4",
    "aiosqlite>=0.19",
    "croniter>=1.3",
    "aiohttp>=3.10",
    "python-dotenv>=1.0",
    "pymitsubishi>=0.1",
    "caldav>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pip-audit>=2.9",
    "ruff==0.16.1",
    "mypy==1.19.1",
    "types-PyYAML>=6.0",
    "types-croniter>=1.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/agents/prompts.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 69
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
